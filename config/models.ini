; Recast local model allowlist. Model paths are relative to the repository root (or absolute); place or symlink your GGUF files under models/.
; Settings are conservative initial values, subject to measured evaluation.
version = 1

[*]
ctx-size = 16384
parallel = 1
batch-size = 512
ubatch-size = 128
n-gpu-layers = 99
split-mode = layer
tensor-split = 1,1
jinja = true
reasoning = off
temp = 0.5
top-p = 0.9
top-k = 20
min-p = 0.0
n-predict = 4096
load-on-startup = false

[recast-fast]
model = models/Qwen3.5-4B-IQ4_NL.gguf

[recast-default]
model = models/Qwen3.5-9B-IQ4_NL.gguf

[recast-quality]
model = models/Qwen3.8-27B-IQ4_NL.gguf
n-gpu-layers = 32

[recast-gemma]
model = models/gemma-4-26B-A4B-it-UD-Q6_K_XL.gguf
n-gpu-layers = 16

[recast-sage]
model = models/Sage-A1.5-Q4_K_M.gguf
n-gpu-layers = 24
