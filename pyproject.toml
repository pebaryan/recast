[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-local"
version = "0.1.0"
description = "Local reference-based writing style transfer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recast = "recast.cli:main"

[tool.setuptools]
packages = ["recast"]

[tool.setuptools.package-data]
recast = ["static/*", "prompts/*.txt"]

[tool.setuptools.data-files]
"share/recast/config" = ["config/models.ini"]
